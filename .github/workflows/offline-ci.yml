# offline-ci.yml - the offline half of this project's test suite, on every push/PR.
#
# What is covered (all of it needs NO CAD, so it runs on a clean windows runner):
#   - tests/selftest.py                    data side: prepare.py -> verify_section.py, negative
#                                          fixtures, tamper detection, schema round-trip (41)
#   - tests/audit/test_audit.py            audit rule engine + report rendering
#   - tests/bench/selftest_checkers.py     bench checkers must REJECT bad input (negative cases)
#   - tests/run_m1.ps1 -DryRunOnly         the end-to-end chain (prepare -> verify -> ezdxf
#                                          round-trip -> tamper -> bad fixtures)
#   - tests/selftest_lisp.ps1              C# LISP wire parser + template generator, compiled
#                                          with the .NET Framework csc that ships on the runner
#
# What is NOT covered, on purpose: anything that needs a running ZWCAD/AutoCAD instance
# (read/section/entity/audit on a real drawing). This machine is the only place those run.
#
# The vendored tools/py-libs fallback is gitignored and machine specific, so CI installs the
# same packages from PyPI instead; run_m1.ps1 reports the ezdxf round-trip as SKIP when the
# library is missing, and as a real PASS/FAIL when pip installed it.

name: offline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: install data-side dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: data-side selftest (41 assertions)
        run: python tests/selftest.py

      - name: audit rule tests
        run: python tests/audit/test_audit.py

      - name: bench checker negative cases
        run: python tests/bench/selftest_checkers.py

      - name: end-to-end dry run (no CAD touched)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run_m1.ps1 -DryRunOnly

      - name: LISP parser + template generator (csc)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/selftest_lisp.ps1

      - name: publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence
          path: |
            tmp/*.json
            tmp/lispwire/*
          if-no-files-found: ignore
